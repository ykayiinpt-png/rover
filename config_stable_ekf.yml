# python -X faultenable main_raspberry_hardware.py
mqtt:
    host: 192.168.137.1
    port: 1883

features: 
    #- video
    - "data"
    #- commands
    #- none

###########################################
# Sensors
###########################################
imu:
    freq: 200 # 200Hz
    bus_address: 0x68
    bus_number: 1
    gyro:
        z:
            offset: 0
            lpf_1_alpha: 0.99

ultra_sounds:
    freq: 0
    front:
        name: "Front"
        key: "u_f"
        gpio:
            trig: 16
            echo: 19
    back:
        name: "Back"
        key: "u_b"
        gpio:
            trig: 20
            echo: 21
    right:
        name: "Right"
        key: "u_r"
        gpio:
            trig: 26
            echo: 7 #"Have to disable SPI in order to add interruption to pin 7 (SPI pin)"
    left:
        name: "Left"
        key: "u_l"
        gpio:
            trig: 5
            echo: 6

###########################################
# Vehicle
###########################################
rover:
    freq: 20 # 20 Hz
    velocity: 200 #147 # 147 RPM = 0.5 m/s
    velocity_rotate: 5 # 20 degree per second
    enable_pid: true
    enable_angle_pid: true
    odometry:
        wheels_base_distance: 0.10 # m, 10cm --> 0.10 m
        left_wheel:
            name: "Left"
            gpio:
                pin: 10
            ticks_per_rev: 20
            wheel_diameter: 0.065 # 0.065m -> 6.5cm
            min_ticks_delta: 2
            lpf_1_alpha: 0.85
            window_filter_size: 0
        right_wheel:
            name: "Right"
            gpio:
                pin: 9
            ticks_per_rev: 20
            wheel_diameter: 0.065 # 0.065m -> 6.5cm
            min_ticks_delta: 2
            lpf_1_alpha: 0.8
            window_filter_size: 0
    angle:
        straight:
            # the width line orientation in compraison to the IMU axis
            ref: 0.0
            pid:
                kp: 3
                ki: 0.01
                kd: 3
    motor_left:
        pwm: 100 # 100 Hz
        max_power: 90
        duty_cycle:
            bais: 15
        gpio:
            in1: 22
            in2: 23
            pwm: 13
        pid:
            max_integral: 1500
            kp: 0
            ki: 0
            kd: 0
            #kp: 0.11
            #ki: 0.01
            #kd: 0.01
            kp: 0.05
            ki: 0.001
            kd: 0.0
            #kp: 4.1
            #ki: 0.9
            #kd: 0
    motor_right:
        pwm: 100 # 100 Hz
        max_power: 90
        duty_cycle:
            bais: 16
        gpio:
            in1: 17
            in2: 27
            pwm: 12
        pid:
            max_integral: 1500
            #kp: 29
            #ki: 0.0 #0.1
            #kd: 0
            #kp: 0.11
            #ki: 0.01
            #kd: 0.01
            kp: 0.03
            ki: 0.0009
            kd: 0.0
            #kp: 0.0
            #ki: 0.0
            #kd: 0

###########################################
# Mapping
###########################################
mapping:
    enabled: true
    width: 8 # 10 meters
    height: 8 # 10 meters
    resolution: 0.1

    occupancy_grid:
        save_file: true

###########################################
# Autonomous navigation
# x-axis 30 cm
# y-axis 24 cm
###########################################
navigation:
    enabled: true
    angle_threshold: 5
    dist_threshold: 0.1
    dim:
        w: 0.24
        l: 0.30 
    waypoints: 
        - [10, 0] # 0deg
        - [10, -10] # -90deg
        - [0, -10]
        - [0, 0]
        - [10, 0]
