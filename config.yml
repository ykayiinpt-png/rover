mqtt:
    host: 192.168.137.1
    port: 1883
features: 
    - video
    - "data"
    #- commands
    #- none
rover:
    velocity: 200 #147 # 147 RPM = 0.5 m/s
    enable_pid: true
    odometry:
        wheel_base_width: 0.10 # m, 10cm --> 0.10 cm
        gpio:
            left: 10
            right: 9
    motor:
        gpio:
            left:
                in1: 22
                in2: 23
                pwm: 13
            right:
                in1: 17
                in2: 27
                pwm: 12
        pid:
            left:
                #kp: 0
                #ki: 0
                #kd: 0
                kp: 0.1
                ki: 0.01
                kd: 0.0
                #kp: 4.1
                #ki: 0.9
                #kd: 0
            right:
                #kp: 29
                #ki: 0.0 #0.1
                #kd: 0
                kp: 0.1
                ki: 0.01
                kd: 0.0
        pwm:
            bais:
                left: 0
                right: 0
    